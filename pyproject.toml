[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defectdojo-mcp-server"
version = "0.1.0"
description = "MCP server for DefectDojo vulnerability management platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "dcianciulli" },
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/defectdojo_mcp"]

[project.scripts]
defectdojo-mcp-server = "defectdojo_mcp.server:main"
